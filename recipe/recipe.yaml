schema_version: 1
context:
  version: 1.5.0.2
  python_min: '3.11'
package:
  name: spacr
  version: ${{ version }}
source:
  url: https://pypi.org/packages/source/s/spacr/spacr-${{ version }}.tar.gz
  sha256: 6fd70dee143b2f594c9769dda3502f0a58a8c4845b7f37140c71a9ad262d0cbe
build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  python:
    entry_points:
    - annotate = spacr.app_annotate:start_annotate_app
    - classify = spacr.app_classify:start_classify_app
    - make_masks = spacr.app_make_masks:gui_make_masks
    - mask = spacr.app_mask:start_mask_app
    - measure = spacr.app_measure:start_measure_app
    - spaceout = spacr.gui:gui_app
    - spacr = spacr.qt:run
    - spacr-db-audit = spacr.cli_database:main
    - spacr-doctor = spacr.doctor:main
    - spacr-leakage = spacr.cli_leakage:main
    - spacr-legacy = spacr.gui:gui_app
    - spacr-nightly = spacr.qt:run
    - spacr-plugins = spacr.cli_plugins:main
    - spacr-qt = spacr.qt:run
    - spacr-remote = spacr.cli_remote:main
    - spacr-repro = spacr.cli_repro:main
    - spacr-run = spacr.cli:main
    - spacr-tk = spacr.gui:gui_app
    - spacr-tutorial = spacr.qt.tutorial.__main__:main
requirements:
  host:
  - python ${{ python_min }}.*
  - pip
  - setuptools >=64
  - wheel
  run:
  - python !=3.14.1,<3.15,>=${{ python_min }}
  - numpy <3.0,>=1.26.4
  - pandas <3.0,>=2.2.1
  - scipy <2.0,>=1.12.0
  - cellpose <5.0,>=4.0
  - scikit-image <0.28,>=0.22.0
  - scikit-learn <2.0,>=1.5.0
  - scikit-posthocs <0.20,>=0.10.0
  - trackpy <1.0,>=0.6.2
  - statsmodels <0.15,>=0.13.0
  - patsy <2.0,>=0.5.6
  - shap <1.0,>=0.45.0
  - pytorch <3.0,>=2.0
  - tensorboard <3.0,>=2.21
  - numba <1.0,>=0.60
  - llvmlite <1.0,>=0.43
  - torchvision <1.0,>=0.15
  - captum <1.0,>=0.7.0
  - seaborn <1.0,>=0.13.2
  - matplotlib-base <4.0,>=3.8.3
  - matplotlib-venn <2.0,>=1.1
  - adjusttext <2.0,>=1.2.0
  - bottleneck <2.0,>=1.3.6
  - numexpr <3.0,>=2.8.4
  - opencv <5.0,>=4.9.0
  - pillow <13,>=10.2.0
  - tifffile >=2023.4.12
  - nd2reader <4.0,>=3.3.0
  - czifile
  - readlif
  - openpyxl <4.0,>=3.1
  - imageio <3.0,>=2.34.0
  - pingouin <0.6,>=0.5.5
  - umap-learn <1.0,>=0.5.11
  - xgboost <4,>=2.0.3
  - biopython <2.0,>=1.80
  - lxml >=5.1.0
  - psutil <8,>=5.9.8
  - gputil <2.0,>=1.4.0
  - nvidia-ml-py <14,>=11.5
  - pytables <4.0,>=3.8.0
  - screeninfo <1.0,>=0.8.1
  - fastremap >=1.14.1
  - tqdm >=4.65.0
  - requests <3.0,>=2.28
  - joblib <2.0,>=1.2
  - natsort <9.0,>=8.0
  - sympy <2.0,>=1.12
  - ipython <10,>=8.18.1
  - ipywidgets <9.0,>=8.1.2
  - huggingface_hub <1.0,>=0.25
  - protobuf >=5.28.3
  - pyside6 <7,>=6.6
  - qtawesome <2,>=1.3
  - segment-anything >=1.0,<2.0
tests:
- python:
    imports:
    - spacr
    # Conda packages expose several PyPI dependencies under different distribution names.
    # The script test checks the actual installed package and entry points.
    pip_check: false
    python_version:
    - ${{ python_min }}
    - '*'
- requirements:
    run:
    - python ${{ python_min }}.*
  script:
  - python -c "from importlib.metadata import version; import spacr; assert version('spacr') == '${{ version }}'"
  - python -c "import shutil; names = ('annotate', 'classify', 'make_masks', 'mask', 'measure', 'spaceout', 'spacr', 'spacr-db-audit', 'spacr-doctor', 'spacr-leakage', 'spacr-legacy', 'spacr-nightly', 'spacr-plugins', 'spacr-qt', 'spacr-remote', 'spacr-repro', 'spacr-run', 'spacr-tk', 'spacr-tutorial'); assert all(shutil.which(name) for name in names)"
  - python -c "import cellpose, segment_anything, torch; from spacr import measure; from spacr.qt import run; assert callable(run)"
  - spacr-run --list
about:
  summary: Spatial phenotype analysis of CRISPR screens
  license: PolyForm-Noncommercial-1.0.0
  license_file: LICENSE
  homepage: https://github.com/EinarOlafsson/spacr
  repository: https://github.com/EinarOlafsson/spacr
  documentation: https://einarolafsson.github.io/spacr/
extra:
  recipe-maintainers:
  - EinarOlafsson
